<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Iconos PWA - Cherry App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #E91E63;
            text-align: center;
            margin-bottom: 30px;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .icon-item {
            text-align: center;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .icon-item:hover {
            border-color: #E91E63;
            transform: translateY(-2px);
        }
        .icon-preview {
            width: 64px;
            height: 64px;
            margin: 0 auto 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
        .download-btn {
            background: #E91E63;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }
        .download-btn:hover {
            background: #C2185B;
        }
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }
        .logo-preview {
            text-align: center;
            margin: 20px 0;
        }
        .logo-preview img {
            max-width: 200px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍒 Generador de Iconos PWA</h1>
        
        <div class="info">
            <strong>Instrucciones:</strong> Este generador crea iconos PWA a partir del logo de Cherry App. 
            Haz clic en "Descargar" para cada tamaño de icono que necesites.
        </div>
        
        <div class="logo-preview">
            <h3>Logo Original:</h3>
            <img src="/images/logo.svg" alt="Cherry Logo" id="logoPreview">
        </div>
        
        <div class="icon-grid" id="iconGrid">
            <!-- Los iconos se generarán dinámicamente -->
        </div>
    </div>

    <script>
        const iconSizes = [
            { size: 72, name: 'icon-72x72.png' },
            { size: 96, name: 'icon-96x96.png' },
            { size: 128, name: 'icon-128x128.png' },
            { size: 144, name: 'icon-144x144.png' },
            { size: 152, name: 'icon-152x152.png' },
            { size: 192, name: 'icon-192x192.png' },
            { size: 384, name: 'icon-384x384.png' },
            { size: 512, name: 'icon-512x512.png' }
        ];

        function generateIcon(size, filename) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // Fondo circular con el color de Cherry
            ctx.fillStyle = '#E91E63';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2, 0, 2 * Math.PI);
            ctx.fill();
            
            // Agregar el emoji de cereza
            ctx.font = `${size * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white';
            ctx.fillText('🍒', size/2, size/2);
            
            return canvas;
        }

        function downloadIcon(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function createIconItem(iconSize) {
            const div = document.createElement('div');
            div.className = 'icon-item';
            
            const preview = document.createElement('div');
            preview.className = 'icon-preview';
            
            const canvas = generateIcon(32, iconSize.name);
            preview.appendChild(canvas);
            
            const sizeText = document.createElement('p');
            sizeText.textContent = `${iconSize.size}x${iconSize.size}`;
            sizeText.style.margin = '10px 0';
            sizeText.style.fontWeight = 'bold';
            
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            downloadBtn.textContent = 'Descargar';
            downloadBtn.onclick = () => {
                const fullCanvas = generateIcon(iconSize.size, iconSize.name);
                downloadIcon(fullCanvas, iconSize.name);
            };
            
            div.appendChild(preview);
            div.appendChild(sizeText);
            div.appendChild(downloadBtn);
            
            return div;
        }

        // Generar todos los iconos
        const iconGrid = document.getElementById('iconGrid');
        iconSizes.forEach(iconSize => {
            iconGrid.appendChild(createIconItem(iconSize));
        });
    </script>
</body>
</html>
