<!DOCTYPE html>
<html>
<head>
    <title>Crear Icono Cherry</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: Arial, sans-serif; 
            background: #f5f5f5; 
            text-align: center; 
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        canvas {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(135deg, #E91E63, #9C27B0);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
        }
        .instructions {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍒 Crear Icono Cherry</h1>
        
        <canvas id="iconCanvas" width="144" height="144"></canvas>
        
        <div>
            <button class="btn" onclick="downloadIcon()">
                💾 Descargar icon-144x144.png
            </button>
        </div>
        
        <div class="instructions">
            <h3>📋 Instrucciones:</h3>
            <ol>
                <li>Haz clic en "Descargar icon-144x144.png"</li>
                <li>Mueve el archivo a la carpeta <code>public/icons/</code></li>
                <li>Reemplaza el archivo existente</li>
                <li>Recarga tu app</li>
            </ol>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');
        
        // Crear icono
        function createIcon() {
            // Fondo circular con gradiente
            const gradient = ctx.createLinearGradient(0, 0, 144, 144);
            gradient.addColorStop(0, '#E91E63');
            gradient.addColorStop(1, '#9C27B0');
            
            // Círculo de fondo
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(72, 72, 68, 0, 2 * Math.PI);
            ctx.fill();
            
            // Borde blanco
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // Emoji de cerezas
            ctx.font = '80px Arial, sans-serif';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍒', 72, 72);
        }
        
        // Descargar icono
        function downloadIcon() {
            const link = document.createElement('a');
            link.download = 'icon-144x144.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Crear icono al cargar
        window.onload = createIcon;
    </script>
</body>
</html>
